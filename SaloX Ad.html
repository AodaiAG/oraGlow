<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaloX · HTML5 Vertical Video Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=El+Messiri:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:'Cairo',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  .serif { font-family:'Amiri',serif; }
  .messiri { font-family:'El Messiri','Cairo',sans-serif; }
  ::-webkit-scrollbar { display:none; }

  /* Premium glowing backdrop animations */
  @keyframes gradientSweep {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .animated-glow-bg {
    background: linear-gradient(135deg, #0e0e12, #181216, #121816, #0e0e12);
    background-size: 400% 400%;
    animation: gradientSweep 12s ease infinite;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- load actual app components -->
<script type="text/babel" src="salox-components.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, createContext, useContext } = React;

const GOLD  = '#D4A835';
const BLUSH = '#E05A6B';
const DARK  = '#1A1A24';
const DURATION = 17; // 17-second loop
const NOOP = () => {};

// ─── HIGH-PERFORMANCE CUSTOM ANIMATION ENGINE ───────
const TimeContext = createContext(0);

const Easing = {
  linear: x => x,
  easeOutCubic: x => 1 - Math.pow(1 - x, 3),
  easeOutBack: x => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
};

const lerp = (a, b, t) => a + (b - a) * t;

const interpolate = (inputRange, outputRange, easing = Easing.linear) => (t) => {
  if (t <= inputRange[0]) return outputRange[0];
  if (t >= inputRange[inputRange.length - 1]) return outputRange[outputRange.length - 1];
  
  for (let i = 0; i < inputRange.length - 1; i++) {
    const start = inputRange[i];
    const end = inputRange[i+1];
    if (t >= start && t <= end) {
      const progress = easing((t - start) / (end - start));
      return lerp(outputRange[i], outputRange[i+1], progress);
    }
  }
  return outputRange[0];
};

const fadeInOut = (start, end, fadeIn=0.4, fadeOut=0.4) => (t) => {
  if (t < start) return 0;
  if (t < start + fadeIn) return (t - start) / fadeIn;
  if (t < end - fadeOut) return 1;
  if (t < end) return 1 - (t - (end - fadeOut)) / fadeOut;
  return 0;
};

// ─── STAGE CONTAINER ────────────────────────────────
const Stage = ({ children, width=540, height=960 }) => {
  const [time, setTime] = useState(0);
  const requestRef = useRef();
  const previousTimeRef = useRef();

  useEffect(() => {
    const animate = (timestamp) => {
      if (previousTimeRef.current !== undefined) {
        const deltaTime = (timestamp - previousTimeRef.current) / 1000;
        setTime(prev => (prev + deltaTime) % DURATION);
      }
      previousTimeRef.current = timestamp;
      requestRef.current = requestAnimationFrame(animate);
    };
    requestRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(requestRef.current);
  }, []);

  const [scale, setScale] = useState(1);
  useEffect(() => {
    const calc = () => {
      const s = Math.min(window.innerWidth / width, window.innerHeight / height, 1);
      setScale(s);
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  return (
    <div style={{
      width: '100vw', height: '100vh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#000', overflow: 'hidden'
    }}>
      <div style={{
        width, height,
        position: 'relative',
        transform: `scale(${scale})`,
        transformOrigin: 'center center',
        background: '#0a0a0f',
        overflow: 'hidden',
        boxShadow: '0 20px 80px rgba(0,0,0,0.8)'
      }}>
        <TimeContext.Provider value={time}>
          {children}
        </TimeContext.Provider>
      </div>
    </div>
  );
};

const Sprite = ({ start, end, children }) => {
  const time = useContext(TimeContext);
  if (time >= start && time <= end) {
    return typeof children === 'function' ? children() : children;
  }
  return null;
};

// ─── DYNAMIC LOGO ───────────────────────────────────
const Logo = ({ size=36, gold=GOLD, accent=BLUSH }) => (
  <svg width={size} height={size} viewBox="0 0 32 32" style={{ filter: 'drop-shadow(0 4px 10px rgba(212,168,53,0.35))' }}>
    <circle cx="16" cy="16" r="13" fill="none" stroke={gold} strokeWidth="1.2"/>
    <line x1="16" y1="3" x2="16" y2="29" stroke={gold} strokeWidth="1"/>
    <line x1="3" y1="16" x2="29" y2="16" stroke={gold} strokeWidth="1"/>
    <circle cx="16" cy="16" r="4" fill="none" stroke={gold} strokeWidth="1.2"/>
    <path d="M16 12 A4 4 0 0 1 20 16 A4 4 0 0 1 16 20 A4 4 0 0 1 12 16 A4 4 0 0 1 16 12" fill={gold} opacity="0.3"/>
    <circle cx="16" cy="16" r="1.5" fill={accent}/>
    {[[16,3],[29,16],[16,29],[3,16]].map(([cx,cy],i)=><circle key={i} cx={cx} cy={cy} r="1.6" fill={accent}/>)}
  </svg>
);

// ─── ACTUAL APP SCREEN SCALING WRAPPER ───────────────
const Phone = ({ screen, y=0, scale=1, opacity=1, sc=0.72 }) => {
  const W = Math.round(393 * sc);
  const H = Math.round(852 * sc);
  return (
    <div style={{
      position:'absolute',
      left:'50%', top:'50%',
      transform:`translate(-50%, calc(-50% + ${y}px)) scale(${scale})`,
      width: W, height: H,
      background:'#0C0C0C',
      borderRadius: Math.round(44 * sc), 
      boxShadow:'0 0 0 1.5px #2e2e2e, 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(212,168,53,.15)',
      opacity,
      zIndex: 10,
      overflow: 'hidden',
      flexShrink: 0
    }}>
      {/* Dynamic island */}
      <div style={{ position:'absolute', top: Math.round(12 * sc), left:'50%', transform:'translateX(-50%)', width: Math.round(128 * sc), height: Math.round(35 * sc), background:'#0C0C0C', borderRadius: Math.round(20 * sc), zIndex:200, pointerEvents:'none' }}/>
      
      {/* Actual Scaled Screen - absolute positioned for 100% perfect layouts */}
      <div style={{
        position: 'absolute',
        top: 0,
        left: 0,
        width: 393,
        height: 852,
        transform: `scale(${sc})`,
        transformOrigin: 'top left',
        pointerEvents: 'none',
        display: 'flex',
        flexDirection: 'column',
        borderRadius: 44,
        overflow: 'hidden',
        background: '#fff'
      }}>
        {screen}
      </div>
    </div>
  );
};

// ─── CLOSER BRAND SCENE ──────────────────────────────
const CTAScene = () => (
  <div dir="rtl" style={{
    width:'100%', height:'100%', position:'relative',
    background:`linear-gradient(135deg, ${DARK} 0%, #0d0c10 100%)`,
    display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center',
    padding:'30px 20px', color:'#fff', fontFamily:"'Cairo',sans-serif"
  }}>
    <div style={{ position:'absolute', inset:0, background:`radial-gradient(circle at 50% 30%, rgba(224,90,107,.2), transparent 60%)` }}/>
    <Logo size={48}/>
    <div style={{ fontSize:22, fontWeight:800, marginTop:18, textAlign:'center', position:'relative', zIndex:2, color:GOLD, fontFamily:"'El Messiri', serif" }}>سـالـوكـس · SaloX</div>
    <div className="serif" style={{ fontSize:34, color:'#fff', lineHeight:1.2, marginTop:6, marginBottom:12, position:'relative', zIndex:2, fontWeight:700 }}>مجتمع الجمال الأول.</div>
    <p style={{ fontSize:10.5, color:'rgba(255,255,255,.7)', textAlign:'center', lineHeight:1.7, marginBottom:24, maxWidth:220, position:'relative', zIndex:2 }}>
      استكشفي، تابعي أعمال الصالونات، واحجزي خبيرتكِ المفضلة بخصوصية تامة.
    </p>
    <div style={{
      width:'100%', padding:'10px 20px', borderRadius:24,
      background:`linear-gradient(135deg, ${GOLD}, #B8891C)`,
      color:'#111', fontSize:13, fontWeight:900, textAlign:'center',
      boxShadow:'0 8px 25px rgba(212,168,53,0.3)', position:'relative', zIndex:2, cursor:'pointer'
    }}>
      ✨ حملي التطبيق مجاناً
    </div>
    <div style={{ marginTop:24, fontSize:9, color:'rgba(255,255,255,.3)', position:'relative', zIndex:2 }}>salox.app · ٢٠٢٦</div>
  </div>
);

// ─── CORE SCENE TIMING & COMPOSITION ──────────────────
const Scene = () => {
  const time = useContext(TimeContext);

  // Background color interpolation based on active animation segments
  const bgHue = interpolate([0, 5, 10, 17], [340, 25, 210, 340])(time);

  // Phone scaling and translation keyframe animations
  const phoneOpacity = interpolate([0, 1.4, 16, 17], [0, 1, 1, 0])(time);
  const phoneY       = interpolate([0, 2, 13, 16, 17], [100, 0, 0, 0, -60], Easing.easeOutCubic)(time);
  const phoneScale   = interpolate([1.4, 2.2, 13, 14.5, 16], [.78, 0.95, 0.95, 0.98, 0.98], Easing.easeOutCubic)(time);

  // Active scene visibilities
  const discoveryOp = fadeInOut(1.6, 6.2, .25, .3)(time);
  const feedOp      = fadeInOut(6.0, 9.2, .25, .3)(time);
  const profileOp   = fadeInOut(9.0, 12.8, .25, .3)(time);
  const proOp       = fadeInOut(12.6, 14.4, .25, .3)(time);
  const ctaOp       = fadeInOut(14.2, 17, .25, .25)(time);

  // Micro-scrolling variables linked to time
  const feedScroll   = interpolate([2.2, 5.8], [0, 420])(time);
  const socialScroll = interpolate([6.4, 8.8], [0, 420])(time);

  return (
    <>
      {/* Mesh Glow Background */}
      <div className="animated-glow-bg" style={{
        position:'absolute', inset:0,
        opacity: 0.85
      }}/>
      <div style={{
        position:'absolute', inset:0,
        background: `
          radial-gradient(circle at 50% 20%, hsla(${bgHue}, 60%, 25%, .4) 0%, transparent 60%),
          radial-gradient(circle at 50% 80%, hsla(${bgHue + 40}, 50%, 20%, .4) 0%, transparent 60%)
        `
      }}/>

      {/* Floating Gold Sparkle Stars */}
      {[[40,160],[480,220],[70,800],[450,780],[270,90],[440,510]].map(([x,y],i)=>{
        const sparkOp = ((Math.sin(time * 3.5 + i) + 1) / 2) * 0.4 + 0.15;
        return (
          <svg key={i} width="16" height="16" viewBox="0 0 22 22" style={{ position:'absolute', left:x, top:y, opacity:sparkOp }}>
            <path d="M11 0 L13.5 8.5 L22 11 L13.5 13.5 L11 22 L8.5 13.5 L0 11 L8.5 8.5 Z" fill={GOLD}/>
          </svg>
        );
      })}

      {/* INTRO TITLE CAPTIONS (0.0s - 2.2s) */}
      <Sprite start={0} end={2.2}>
        {() => {
          const op = fadeInOut(0, 2.2, .4, .4)(time);
          const y  = interpolate([0, 1.4], [50, 0], Easing.easeOutCubic)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', top:'28%', left:0, right:0, textAlign:'center', opacity:op, transform:`translateY(${y}px)`, padding:'0 24px', fontFamily:"'Cairo',sans-serif" }}>
              <div className="messiri" style={{ fontSize:22, color:GOLD, fontWeight:800, letterSpacing:6, marginBottom:16 }}>سالوكس · SaloX</div>
              <div style={{ fontSize:36, fontWeight:900, color:'#fff', lineHeight:1.25 }}>
                أول سوشال ميديا للجمال<br/>
                <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD }}>على بُعد لمسة ✨</span>
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* DYNAMIC SCREEN PHONE MOCKUP RENDERING THE REAL APP SCREENS */}
      <div style={{ opacity:phoneOpacity }}>
        
        {/* 1. Vetted Salon Catalog (Home screen) */}
        <Sprite start={1.4} end={6.2}>
          <Phone y={phoneY} scale={phoneScale} opacity={discoveryOp}
            screen={<StoreScreen onSalonClick={NOOP} navTab="home" onNavigate={NOOP} scrollY={feedScroll}/>}
          />
        </Sprite>

        {/* 2. Social Media Lookbook Feed */}
        <Sprite start={6.0} end={9.2}>
          <Phone y={phoneY} scale={phoneScale} opacity={feedOp}
            screen={<FeedScreen onSalonClick={NOOP} navTab="store" onNavigate={NOOP} scrollY={socialScroll}/>}
          />
        </Sprite>

        {/* 3. Vetted Salon Profile sanctuary screen */}
        <Sprite start={9.0} end={12.8}>
          <Phone y={phoneY} scale={phoneScale} opacity={profileOp}
            screen={<SalonProfileScreen salon={SALONS[0]} onBack={NOOP} onBook={NOOP} initialTab="services"/>}
          />
        </Sprite>

        {/* 4. Expert Stylist selection */}
        <Sprite start={12.6} end={14.4}>
          <Phone y={phoneY} scale={phoneScale} opacity={proOp}
            screen={<SelectProfessionalScreen onBack={NOOP} onSelect={NOOP}/>}
          />
        </Sprite>

        {/* 5. Brand Closer page */}
        <Sprite start={14.2} end={17.0}>
          <Phone y={phoneY} scale={phoneScale} opacity={ctaOp}
            screen={<CTAScene/>}
          />
        </Sprite>

      </div>

      {/* DYNAMIC SCENE CAPTIONS (RTL ARABIC) */}
      
      {/* 1. Discovery Caption (2.4s - 5.8s) */}
      <Sprite start={2.4} end={5.8}>
        {() => {
          const op = fadeInOut(2.4, 5.8, .3, .35)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', top:56, right:0, left:0, textAlign:'center', opacity:op, padding:'0 24px' }}>
              <div style={{ fontSize:12, fontWeight:800, color:GOLD, letterSpacing:2, marginBottom:6 }}>دليل الصالونات الموثوق</div>
              <div style={{ fontSize:26, fontWeight:900, color:'#fff', lineHeight:1.3 }}>
                اكتشفي صالونات النخبة<br/>
                <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD }}>من حولكِ بكل سهولة.</span>
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* 2. Social Feed Caption (6.0s - 8.8s) */}
      <Sprite start={6.0} end={8.8}>
        {() => {
          const op = fadeInOut(6.0, 8.8, .3, .3)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', top:56, right:0, left:0, textAlign:'center', opacity:op, padding:'0 24px' }}>
              <div style={{ fontSize:12, fontWeight:800, color:GOLD, letterSpacing:2, marginBottom:6 }}>أول سوشال ميديا جمالي</div>
              <div style={{ fontSize:24, fontWeight:900, color:'#fff', lineHeight:1.3 }}>
                شاهدي إبداع الصالونات<br/>
                <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD }}>بأعمالهنَّ الحقيقية الواقعية.</span>
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* 3. Profile Services Caption (9.0s - 12.4s) */}
      <Sprite start={9.0} end={12.4}>
        {() => {
          const op = fadeInOut(9.0, 12.4, .3, .3)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', top:56, right:0, left:0, textAlign:'center', opacity:op, padding:'0 24px' }}>
              <div style={{ fontSize:12, fontWeight:800, color:GOLD, letterSpacing:2, marginBottom:6 }}>خدمات فاخرة وتفاصيل كاملة</div>
              <div style={{ fontSize:24, fontWeight:900, color:'#fff', lineHeight:1.3 }}>
                تفحصي الخدمات والأسعار<br/>
                <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD }}>واحجزي بثقة تامة.</span>
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* 4. Expert Specialists Caption (12.6s - 14.4s) */}
      <Sprite start={12.6} end={14.4}>
        {() => {
          const op = fadeInOut(12.6, 14.4, .25, .25)(time);
          const scale = interpolate([12.6, 13.2], [.8, 1], Easing.easeOutBack)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', top:56, right:0, left:0, textAlign:'center', opacity:op, transform:`scale(${scale})`, padding:'0 24px' }}>
              <div style={{ fontSize:24, fontWeight:900, color:'#fff', lineHeight:1.3 }}>
                اختاري <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD }}>خبيرة التجميل</span> المفضلة.
              </div>
              <div style={{ fontSize:12, color:'rgba(255,255,255,.7)', marginTop:6 }}>خبيرات معتمدات، بخصوصية وسرية تامة.</div>
            </div>
          );
        }}
      </Sprite>

      {/* OUTRO CLOSER & BOUNCING ARROW (14.2s - 17.0s) */}
      <Sprite start={14.2} end={17.0}>
        {() => {
          const op = fadeInOut(14.2, 17.0, .3, .3)(time);
          const y  = interpolate([14.2, 15.0], [50, 0], Easing.easeOutCubic)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', bottom:64, right:30, left:30, textAlign:'center', opacity:op, transform:`translateY(${y}px)`, zIndex: 20 }}>
              <div style={{ fontSize:11, color:GOLD, fontWeight:800, letterSpacing:4, marginBottom:10 }}>ربيع ٢٠٢٦ · إطلاق قريب</div>
              <div style={{
                display:'inline-flex', alignItems:'center', gap:8, padding:'12px 28px', borderRadius:28,
                background:`linear-gradient(135deg, ${GOLD}, #B8891C)`, color:'#111',
                fontWeight:900, fontSize:14.5, boxShadow:'0 10px 30px rgba(212,168,53,0.3)', cursor:'pointer'
              }}>
                🚀 انضمي إلى مجتمع سالوكس
              </div>
            </div>
          );
        }}
      </Sprite>

      <Sprite start={14.8} end={16.6}>
        {() => {
          const bob = Math.sin((time - 14.8) * 5) * 8;
          const op  = fadeInOut(14.8, 16.6, .25, .25)(time);
          return (
            <div style={{ position:'absolute', bottom:20, left:'50%', transform:`translateX(-50%) translateY(${bob}px)`, opacity:op, fontSize:32, zIndex:20 }}>👆</div>
          );
        }}
      </Sprite>
    </>
  );
};

// ─── STAGE BOOTSTRAP ────────────────────────────────
const App = () => (
  <Stage width={540} height={960}>
    <Scene/>
  </Stage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
