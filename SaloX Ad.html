<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, createContext, useContext } = React;

const GOLD  = '#D4A835';
const BLUSH = '#FFFFFF';
const DARK  = '#1A1A24';
const DURATION = 19; // 19-second loop
const NOOP = () => {};

// ─── HIGH-PERFORMANCE CUSTOM ANIMATION ENGINE ───────
const TimeContext = createContext(0);

const Easing = {
  linear: x => x,
  easeOutCubic: x => 1 - Math.pow(1 - x, 3),
  easeOutBack: x => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
};

const lerp = (a, b, t) => a + (b - a) * t;

const interpolate = (inputRange, outputRange, easing = Easing.linear) => (t) => {
  if (t <= inputRange[0]) return outputRange[0];
  if (t >= inputRange[inputRange.length - 1]) return outputRange[outputRange.length - 1];
  
  for (let i = 0; i < inputRange.length - 1; i++) {
    const start = inputRange[i];
    const end = inputRange[i+1];
    if (t >= start && t <= end) {
      const progress = easing((t - start) / (end - start));
      return lerp(outputRange[i], outputRange[i+1], progress);
    }
  }
  return outputRange[0];
};

const fadeInOut = (start, end, fadeIn=0.4, fadeOut=0.4) => (t) => {
  if (t < start) return 0;
  if (t < start + fadeIn) return (t - start) / fadeIn;
  if (t < end - fadeOut) return 1;
  if (t < end) return 1 - (t - (end - fadeOut)) / fadeOut;
  return 0;
};

// ─── STAGE CONTAINER ────────────────────────────────
const Stage = ({ children, width=540, height=960 }) => {
  const [time, setTime] = useState(0);
  const requestRef = useRef();
  const previousTimeRef = useRef();

  useEffect(() => {
    const animate = (timestamp) => {
      if (previousTimeRef.current !== undefined) {
        const deltaTime = (timestamp - previousTimeRef.current) / 1000;
        setTime(prev => (prev + deltaTime) % DURATION);
      }
      previousTimeRef.current = timestamp;
      requestRef.current = requestAnimationFrame(animate);
    };
    requestRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(requestRef.current);
  }, []);

  const [scale, setScale] = useState(1);
  useEffect(() => {
    const calc = () => {
      const s = Math.min(window.innerWidth / width, window.innerHeight / height, 1);
      setScale(s);
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  return (
    <div style={{
      width: '100vw', height: '100vh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#000', overflow: 'hidden'
    }}>
      <div style={{
        width, height,
        position: 'relative',
        transform: `scale(${scale})`,
        transformOrigin: 'center center',
        background: '#0a0a0f',
        overflow: 'hidden',
        boxShadow: '0 20px 80px rgba(0,0,0,0.8)'
      }}>
        <TimeContext.Provider value={time}>
          {children}
        </TimeContext.Provider>
      </div>
    </div>
  );
};

const Sprite = ({ start, end, children }) => {
  const time = useContext(TimeContext);
  if (time >= start && time <= end) {
    return typeof children === 'function' ? children() : children;
  }
  return null;
};

// ─── DYNAMIC LOGO ───────────────────────────────────
const Logo = ({ size=36, gold=GOLD, accent=BLUSH }) => (
  <svg width={size} height={size} viewBox="0 0 32 32" style={{ filter: 'drop-shadow(0 4px 10px rgba(212,168,53,0.35))' }}>
    <circle cx="16" cy="16" r="13" fill="none" stroke={gold} strokeWidth="1.2"/>
    <line x1="16" y1="3" x2="16" y2="29" stroke={gold} strokeWidth="1"/>
    <line x1="3" y1="16" x2="29" y2="16" stroke={gold} strokeWidth="1"/>
    <circle cx="16" cy="16" r="4" fill="none" stroke={gold} strokeWidth="1.2"/>
    <path d="M16 12 A4 4 0 0 1 20 16 A4 4 0 0 1 16 20 A4 4 0 0 1 12 16 A4 4 0 0 1 16 12" fill={gold} opacity="0.3"/>
    <circle cx="16" cy="16" r="1.5" fill={accent}/>
    {[[16,3],[29,16],[16,29],[3,16]].map(([cx,cy],i)=><circle key={i} cx={cx} cy={cy} r="1.6" fill={accent}/>)}
  </svg>
);

// ─── TOUCH CLICK PULSING INDICATOR ───────────────────
const TouchIndicator = ({ x, y, start, end }) => {
  const time = useContext(TimeContext);
  if (time < start || time > end) return null;
  const progress = (time - start) / (end - start);
  
  // Fade in, hold, and fade out opacity
  let opacity = 0;
  if (progress < 0.15) opacity = progress / 0.15;
  else if (progress < 0.85) opacity = 1;
  else opacity = (1 - progress) / 0.15;

  const rippleScale = 0.6 + 1.4 * progress;
  const rippleOp = Math.max(0, 0.7 - 0.7 * progress);

  return (
    <div style={{
      position: 'absolute',
      left: x,
      top: y,
      transform: 'translate(-50%, -50%)',
      width: 44,
      height: 44,
      zIndex: 9999,
      pointerEvents: 'none'
    }}>
      {/* Ripple ring */}
      <div style={{
        position: 'absolute',
        inset: 0,
        borderRadius: '50%',
        border: `3px solid ${GOLD}`,
        transform: `scale(${rippleScale})`,
        opacity: rippleOp,
        transition: 'none'
      }}/>
      {/* Central touch dot */}
      <div style={{
        position: 'absolute',
        inset: 8,
        borderRadius: '50%',
        background: `radial-gradient(circle, #FFF 20%, ${GOLD} 100%)`,
        boxShadow: `0 0 15px ${GOLD}`,
        opacity,
        transition: 'none'
      }}/>
    </div>
  );
};

// ─── ACTUAL APP SCREEN SCALING WRAPPER ───────────────
const Phone = ({ screen, y=0, scale=1, opacity=1, sc=0.72, touches }) => {
  const W = Math.round(393 * sc);
  const H = Math.round(852 * sc);
  return (
    <div style={{
      position:'absolute',
      left:'50%', top:'50%',
      transform:`translate(-50%, calc(-50% + ${y}px)) scale(${scale})`,
      width: W, height: H,
      background:'#0C0C0C',
      borderRadius: Math.round(44 * sc), 
      boxShadow:'0 0 0 1.5px #2e2e2e, 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(212,168,53,.15)',
      opacity,
      zIndex: 10,
      overflow: 'hidden',
      flexShrink: 0
    }}>
      {/* Dynamic island */}
      <div style={{ position:'absolute', top: Math.round(12 * sc), left:'50%', transform:'translateX(-50%)', width: Math.round(128 * sc), height: Math.round(35 * sc), background:'#0C0C0C', borderRadius: Math.round(20 * sc), zIndex:200, pointerEvents:'none' }}/>
      
      {/* Actual Scaled Screen - absolute positioned for 100% perfect layouts */}
      <div style={{
        position: 'absolute',
        top: 0,
        left: 0,
        width: 393,
        height: 852,
        transform: `scale(${sc})`,
        transformOrigin: 'top left',
        pointerEvents: 'none',
        display: 'flex',
        flexDirection: 'column',
        borderRadius: 44,
        overflow: 'hidden',
        background: '#fff'
      }}>
        {screen}
        {touches}
      </div>
    </div>
  );
};

// ─── CLOSER BRAND SCENE ──────────────────────────────
const CTAScene = () => (

    <div className="serif" style={{ fontSize:32, color:'#fff', lineHeight:1.2, marginTop:6, marginBottom:12, position:'relative', zIndex:2, fontWeight:700, textShadow: '0 4px 12px rgba(0,0,0,0.5)' }}>ترقبي الإطلاق قريباً</div>
    <p style={{ fontSize:12, color:'rgba(255,255,255,.7)', textAlign:'center', lineHeight:1.7, marginBottom:24, maxWidth:240, position:'relative', zIndex:2, fontFamily: "'Cairo', sans-serif" }}>

    <div style={{
      width:'100%', padding:'12px 20px', borderRadius:24,
      background:`linear-gradient(135deg, ${GOLD}, #B8891C)`,

  // Active scene visibilities
  const discoveryOp = fadeInOut(1.4, 4.8, .25, .25)(time);
  const searchOp    = fadeInOut(4.6, 7.8, .25, .25)(time);
  const feedOp      = fadeInOut(7.6, 10.8, .25, .25)(time);
  const profileOp   = fadeInOut(10.6, 13.8, .25, .25)(time);
  const proOp       = fadeInOut(13.6, 15.8, .25, .25)(time);
  const ctaOp       = fadeInOut(15.6, 19.0, .25, .25)(time);

  // Micro-scrolling variables linked to time

  const socialScroll = interpolate([8.0, 10.4], [0, 420])(time);

  return (
    <>
      {/* Mesh Glow Background */}
      <div className="animated-glow-bg" style={{
        position:'absolute', inset:0,
        opacity: 0.85
      }}/>
      <div style={{
        position:'absolute', inset:0,
        background: `
          radial-gradient(circle at 50% 20%, hsla(${bgHue}, 60%, 25%, .4) 0%, transparent 60%),
          radial-gradient(circle at 50% 80%, hsla(${bgHue + 40}, 50%, 20%, .4) 0%, transparent 60%)
        `
      }}/>

      {/* Floating Gold Sparkle Stars */}
      {[[40,160],[480,220],[70,800],[450,780],[270,90],[440,510]].map(([x,y],i)=>{
        const sparkOp = ((Math.sin(time * 3.5 + i) + 1) / 2) * 0.4 + 0.15;
        return (

      {/* INTRO TITLE CAPTIONS (0.0s - 2.2s) */}

          return (
            <div dir="rtl" style={{ position:'absolute', top:'28%', left:0, right:0, textAlign:'center', opacity:op, transform:`translateY(${y}px)`, padding:'0 24px', fontFamily:"'El Messiri','Cairo',sans-serif" }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, marginBottom: 20 }}>
                <span style={{ fontSize: 28, fontWeight: 700, color: GOLD, letterSpacing: 2, fontFamily: "'El Messiri', sans-serif", textShadow: '0 4px 15px rgba(212,168,53,0.35)' }}>أورا غلو</span>
                <span style={{ color: 'rgba(255,255,255,0.3)', fontSize: 24 }}>·</span>
                <div dir="ltr" style={{ display: 'flex', alignItems: 'center' }}>
                  <span style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 34, fontWeight: 300, fontStyle: 'italic', color: '#F0D080' }}>Ora</span>

                </div>
              </div>
              <div style={{ fontSize:36, fontWeight:700, color:'#fff', lineHeight:1.35, fontFamily: "'El Messiri', sans-serif", textShadow: '0 6px 25px rgba(0,0,0,0.6)' }}>
                اكتشفي، قارني، واحجزي<br/>
                <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD, textShadow: `0 0 12px ${GOLD}66` }}>أفضل الصالونات القريبة منكِ</span>
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* DYNAMIC SCREEN PHONE MOCKUP RENDERING THE REAL APP SCREENS */}
      <div style={{ opacity:phoneOpacity }}>
        
        {/* 1. Vetted Salon Catalog (Home screen) */}
        <Sprite start={1.4} end={4.8}>
          <Phone y={phoneY} scale={phoneScale} opacity={discoveryOp}
            screen={<StoreScreen onSalonClick={NOOP} navTab="home" onNavigate={NOOP} scrollY={feedScroll}/>}
            touches={<TouchIndicator x={275} y={810} start={4.0} end={4.6}/>}
          />
        </Sprite>

        {/* 2. Interactive Map Search screen */}
        <Sprite start={4.6} end={7.8}>
          <Phone y={phoneY} scale={phoneScale} opacity={searchOp}
            screen={<SearchScreen onSalonClick={NOOP} navTab="search" onNavigate={NOOP} initialView="card" />}

          />

        {/* 3. Social Media Lookbook Feed */}
        <Sprite start={7.6} end={10.8}>
          <Phone y={phoneY} scale={phoneScale} opacity={feedOp}
            screen={<FeedScreen onSalonClick={NOOP} navTab="store" onNavigate={NOOP} scrollY={socialScroll}/>}
            touches={<TouchIndicator x={68} y={730} start={10.0} end={10.6}/>}

        <Sprite start={10.6} end={13.8}>

            screen={<CTAScene/>}
          />

      </div>

      {/* DYNAMIC SCENE CAPTIONS (RTL ARABIC) */}
      
      {/* 1. Discovery Caption (2.4s - 4.6s) */}
      <Sprite start={2.4} end={4.6}>
        {() => {
          const op = fadeInOut(2.4, 4.6, .3, .25)(time);
          return (
            <div dir="rtl" style={{
              position:'absolute', top:50, left:'50%', transform:'translateX(-50%)', width:'88%',
              padding:'14px 20px', borderRadius:'22px', background:'rgba(12,12,18,0.82)', backdropFilter:'blur(16px)',
              border:`1px solid rgba(212,168,53,0.25)`, boxShadow:'0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 15px rgba(212,168,53,0.1)',
              textAlign:'center', opacity:op, zIndex:30, fontFamily:"'El Messiri','Cairo',sans-serif"
            }}>
              <div style={{ fontSize:14, fontWeight:700, color:GOLD, letterSpacing:2, marginBottom:4 }}>أورا غلو · قريباً جداً</div>

        {() => {
          const op = fadeInOut(7.8, 10.6, .3, .25)(time);
          return (

              position:'absolute', top:50, left:'50%', transform:'translateX(-50%)', width:'88%',
              padding:'14px 20px', borderRadius:'22px', background:'rgba(12,12,18,0.82)', backdropFilter:'blur(16px)',
              border:`1px solid rgba(212,168,53,0.25)`, boxShadow:'0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 15px rgba(212,168,53,0.1)',

            }}>

              padding:'14px 20px', borderRadius:'22px', background:'rgba(12,12,18,0.82)', backdropFilter:'blur(16px)',
              border:`1px solid rgba(212,168,53,0.25)`, boxShadow:'0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 15px rgba(212,168,53,0.1)',
              textAlign:'center', opacity:op, zIndex:30, fontFamily:"'El Messiri','Cairo',sans-serif"
            }}>
              <div style={{ fontSize:14, fontWeight:700, color:GOLD, letterSpacing:2, marginBottom:4 }}>شفافية الأسعار والخدمات</div>
              <div style={{ fontSize:22, fontWeight:700, color:'#fff', lineHeight:1.35, textShadow: '0 2px 10px rgba(0,0,0,0.5)' }}>
                قارني أسعار الخدمات الحقيقية<br/>
                <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD, textShadow: `0 0 8px ${GOLD}44` }}>واحجزي موعدكِ مباشرة مع الصالون.</span>
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* 5. Expert Specialists Caption (13.8s - 15.8s) */}
      <Sprite start={13.8} end={15.8}>
        {() => {
          const op = fadeInOut(13.8, 15.8, .25, .25)(time);
          const scale = interpolate([13.8, 14.4], [.8, 1], Easing.easeOutBack)(time);
          return (
            <div dir="rtl" style={{
              position:'absolute', top:50, left:'50%', transform:`translateX(-50%) scale(${scale})`, width:'88%',
              padding:'14px 20px', borderRadius:'22px', background:'rgba(12,12,18,0.82)', backdropFilter:'blur(16px)',
              border:`1px solid rgba(212,168,53,0.25)`, boxShadow:'0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 15px rgba(212,168,53,0.1)',
              textAlign:'center', opacity:op, zIndex:30, fontFamily:"'El Messiri','Cairo',sans-serif"
            }}>
              <div style={{ fontSize:22, fontWeight:700, color:'#fff', lineHeight:1.35, marginBottom:4, textShadow: '0 2px 10px rgba(0,0,0,0.5)' }}>
                اختاري <span className="serif" style={{ fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500, color:GOLD, textShadow: `0 0 8px ${GOLD}44` }}>خبيرتكِ المفضلة</span>
              </div>
              <div style={{ fontSize:13, color:'rgba(255,255,255,.75)', fontWeight:600 }}>احجزي مع خبيرتكِ المعتمدة في ثوانٍ معدودة.</div>
            </div>
          );
        }}
      </Sprite>

      {/* OUTRO CLOSER & BOUNCING ARROW (15.6s - 19.0s) */}
      <Sprite start={15.6} end={19.0}>
        {() => {
          const op = fadeInOut(15.6, 19.0, .3, .3)(time);
          const y  = interpolate([15.6, 16.4], [50, 0], Easing.easeOutCubic)(time);
          return (
            <div dir="rtl" style={{ position:'absolute', bottom:64, right:30, left:30, textAlign:'center', opacity:op, transform:`translateY(${y}px)`, zIndex: 20, fontFamily:"'El Messiri','Cairo',sans-serif" }}>
              <div style={{ fontSize:12, color:GOLD, fontWeight:800, letterSpacing:4, marginBottom:10 }}>ترقبي الإطلاق قريباً جداً · ٢٠٢٦</div>
              <div style={{
                display:'inline-flex', alignItems:'center', gap:8, padding:'14px 32px', borderRadius:28,
                background:`linear-gradient(135deg, ${GOLD}, #B8891C)`, color:'#111',
                fontWeight:900, fontSize:15.5, boxShadow:'0 10px 30px rgba(212,168,53,0.4)', cursor:'pointer'
              }}>
                أورا غلو · ترقبينا قريباً
              </div>
            </div>
          );
        }}
      </Sprite>
    </>
  );
};

// ─── STAGE BOOTSTRAP ────────────────────────────────
const App = () => (
  <Stage width={540} height={960}>
    <Scene/>
  </Stage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
