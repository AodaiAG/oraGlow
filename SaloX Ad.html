<style>

<div id="root"></div>

<!-- load actual app components -->
<script type="text/babel" src="salox-components.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, createContext, useContext } = React;

const GOLD  = '#D4A835';
const BLUSH = '#FFFFFF';
const DARK  = '#1A1A24';
const DURATION = 25; // 25-second loop
const NOOP = () => {};

// ─── HIGH-PERFORMANCE CUSTOM ANIMATION ENGINE ───────
const TimeContext = createContext(0);

const Easing = {
  linear: x => x,
  easeOutCubic: x => 1 - Math.pow(1 - x, 3),
  easeOutBack: x => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
};

const lerp = (a, b, t) => a + (b - a) * t;

const interpolate = (inputRange, outputRange, easing = Easing.linear) => (t) => {
  if (t <= inputRange[0]) return outputRange[0];
  if (t >= inputRange[inputRange.length - 1]) return outputRange[outputRange.length - 1];
  
  for (let i = 0; i < inputRange.length - 1; i++) {
    const start = inputRange[i];
    const end = inputRange[i+1];
    if (t >= start && t <= end) {
      const progress = easing((t - start) / (end - start));
      return lerp(outputRange[i], outputRange[i+1], progress);
    }
  }
  return outputRange[0];
};

const fadeInOut = (start, end, fadeIn=0.4, fadeOut=0.4) => (t) => {
  if (t < start) return 0;
  if (t < start + fadeIn) return (t - start) / fadeIn;
  if (t < end - fadeOut) return 1;
  if (t < end) return 1 - (t - (end - fadeOut)) / fadeOut;
  return 0;
};

// ─── STAGE CONTAINER ────────────────────────────────
const Stage = ({ children, width=540, height=960 }) => {
  const [time, setTime] = useState(0);
  const requestRef = useRef();
  const previousTimeRef = useRef();

  useEffect(() => {
    const animate = (timestamp) => {
      if (previousTimeRef.current !== undefined) {
        const deltaTime = (timestamp - previousTimeRef.current) / 1000;
        setTime(prev => (prev + deltaTime) % DURATION);
      }
      previousTimeRef.current = timestamp;
      requestRef.current = requestAnimationFrame(animate);
    };
    requestRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(requestRef.current);
  }, []);

  const [scale, setScale] = useState(1);
  useEffect(() => {
    const calc = () => {
      const s = Math.min(window.innerWidth / width, window.innerHeight / height, 1);
      setScale(s);
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  return (
    <div style={{
      width: '100vw', height: '100vh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#000', overflow: 'hidden'
    }}>
      <div style={{
        width, height,
        position: 'relative',
        transform: `scale(${scale})`,
        transformOrigin: 'center center',
        background: '#0a0a0f',
        overflow: 'hidden',
        boxShadow: '0 20px 80px rgba(0,0,0,0.8)'
      }}>
        <TimeContext.Provider value={time}>
          {children}
        </TimeContext.Provider>
      </div>
    </div>
  );
};

const Sprite = ({ start, end, children }) => {
  const time = useContext(TimeContext);
  if (time >= start && time <= end) {
    return typeof children === 'function' ? children() : children;
  }
  return null;
};

// ─── DYNAMIC LOGO ───────────────────────────────────
const Logo = ({ size=36, gold=GOLD, accent=BLUSH }) => (
  <svg width={size} height={size} viewBox="0 0 32 32" style={{ filter: 'drop-shadow(0 4px 10px rgba(212,168,53,0.35))' }}>
    <circle cx="16" cy="16" r="13" fill="none" stroke={gold} strokeWidth="1.2"/>
    <line x1="16" y1="3" x2="16" y2="29" stroke={gold} strokeWidth="1"/>
    <line x1="3" y1="16" x2="29" y2="16" stroke={gold} strokeWidth="1"/>
    <circle cx="16" cy="16" r="4" fill="none" stroke={gold} strokeWidth="1.2"/>
    <path d="M16 12 A4 4 0 0 1 20 16 A4 4 0 0 1 16 20 A4 4 0 0 1 12 16 A4 4 0 0 1 16 12" fill={gold} opacity="0.3"/>
    <circle cx="16" cy="16" r="1.5" fill={accent}/>
    {[[16,3],[29,16],[16,29],[3,16]].map(([cx,cy],i)=><circle key={i} cx={cx} cy={cy} r="1.6" fill={accent}/>)}
  </svg>
);

// ─── TOUCH CLICK PULSING INDICATOR ───────────────────
const TouchIndicator = ({ x, y, start, end }) => {
  const time = useContext(TimeContext);
  if (time < start || time > end) return null;
  const progress = (time - start) / (end - start);
  
  // Fade in, hold, and fade out opacity
  let opacity = 0;
  if (progress < 0.15) opacity = progress / 0.15;
  else if (progress < 0.85) opacity = 1;
  else opacity = (1 - progress) / 0.15;

  const rippleScale = 0.6 + 1.4 * progress;
  const rippleOp = Math.max(0, 0.7 - 0.7 * progress);

  return (
    <div style={{
      position: 'absolute',
      left: x,
      top: y,
      transform: 'translate(-50%, -50%)',
      width: 44,
      height: 44,
      zIndex: 9999,
      pointerEvents: 'none'
    }}>
      {/* Ripple ring */}
      <div style={{
        position: 'absolute',
        inset: 0,
        borderRadius: '50%',
        border: `3px solid ${GOLD}`,
        transform: `scale(${rippleScale})`,
        opacity: rippleOp,
        transition: 'none'
      }}/>
      {/* Central touch dot */}
      <div style={{
        position: 'absolute',
        inset: 8,
        borderRadius: '50%',
        background: `radial-gradient(circle, #FFF 20%, ${GOLD} 100%)`,
        boxShadow: `0 0 15px ${GOLD}`,
        opacity,
        transition: 'none'
      }}/>
    </div>
  );
};

// ─── FLOATING CURSOR POINTER ─────────────────────────
const FloatingCursor = ({ path }) => {
  const time = useContext(TimeContext);
  
  if (!path || path.length === 0) return null;
  
  // Find coordinates
  let x = 200;
  let y = 600;
  let opacity = 0;
  let scale = 1;
  
  if (time < path[0].t) {
    x = path[0].x;
    y = path[0].y;
    opacity = path[0].op ?? 0;
    scale = path[0].sc ?? 1;
  } else if (time >= path[path.length - 1].t) {
    x = path[path.length - 1].x;
    y = path[path.length - 1].y;
    opacity = path[path.length - 1].op ?? 0;
    scale = path[path.length - 1].sc ?? 1;
  } else {
    for (let i = 0; i < path.length - 1; i++) {
      const start = path[i];
      const end = path[i+1];
      if (time >= start.t && time <= end.t) {
        const t = (time - start.t) / (end.t - start.t);
        // Smooth ease-in-out for translation, linear for scale/opacity
        const easeT = Easing.easeOutCubic(t);
        x = lerp(start.x, end.x, easeT);
        y = lerp(start.y, end.y, easeT);
        opacity = lerp(start.op ?? 1, end.op ?? 1, t);
        scale = lerp(start.sc ?? 1, end.sc ?? 1, t);
        break;
      }
    }
  }
  
  if (opacity <= 0.01) return null;
  
  return (
    <div style={{
      position: 'absolute',
      left: x - 5,
      top: y - 2,
      transform: `scale(${scale})`,
      zIndex: 99999,
      pointerEvents: 'none',
      transition: 'none'
    }}>
      <svg width="34" height="34" viewBox="0 0 28 28" style={{ filter: 'drop-shadow(0 3px 8px rgba(212,168,53,0.75))', transform: 'rotate(-10deg)' }}>
        <path d="M5 2 L5 22 L11 16 L16.5 27 L20 25.5 L14.5 14.5 L21 14.5 Z" fill="#FFFFFF" stroke="#D4A835" strokeWidth="2" strokeLinejoin="round"/>
      </svg>
    </div>
  );
};


// ─── ACTUAL APP SCREEN SCALING WRAPPER ───────────────
const Phone = ({ screen, y=0, scale=1, opacity=1, sc=0.72, touches }) => {
  const W = Math.round(393 * sc);
  const H = Math.round(852 * sc);
  return (
    <div style={{
      position:'absolute',
      left:'50%', top:'50%',
      transform:`translate(-50%, calc(-50% + ${y}px)) scale(${scale})`,
      width: W, height: H,
      background:'#0C0C0C',
      borderRadius: Math.round(44 * sc), 
      boxShadow:'0 0 0 1.5px #2e2e2e, 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(212,168,53,.15)',
      opacity,
      zIndex: 10,
      overflow: 'hidden',
      flexShrink: 0
    }}>
      {/* Dynamic island */}
      <div style={{ position:'absolute', top: Math.round(12 * sc), left:'50%', transform:'translateX(-50%)', width: Math.round(128 * sc), height: Math.round(35 * sc), background:'#0C0C0C', borderRadius: Math.round(20 * sc), zIndex:200, pointerEvents:'none' }}/>
      
      {/* Actual Scaled Screen - absolute positioned for 100% perfect layouts */}
      <div style={{
        position: 'absolute',
        top: 0,
        left: 0,
        width: 393,
        height: 852,
        transform: `scale(${sc})`,
        transformOrigin: 'top left',
        pointerEvents: 'none',
        display: 'flex',
        flexDirection: 'column',
        borderRadius: 44,
        overflow: 'hidden',
        background: '#fff'
      }}>
        {screen}
        {touches}
      </div>
    </div>
  );
};

// ─── CLOSER BRAND SCENE ──────────────────────────────
const CTAScene = () => (
  <div dir="rtl" style={{
    width:'100%', height:'100%', position:'relative',
    background:`linear-gradient(135deg, ${DARK} 0%, #0d0c10 100%)`,
    display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center',
    padding:'30px 20px', color:'#fff', fontFamily:"'El Messiri','Cairo',sans-serif"
  }}>
    <div style={{ position:'absolute', inset:0, background:`radial-gradient(circle at 50% 30%, rgba(212,168,53,.15), transparent 60%)` }}/>
    <Logo size={48}/>
    <div style={{ fontSize:22, fontWeight:800, marginTop:18, textAlign:'center', position:'relative', zIndex:2, color:GOLD, fontFamily:"'El Messiri', serif" }}>أورا غلو · OraGlow</div>
    <div className="serif" style={{ fontSize:32, color:'#fff', lineHeight:1.2, marginTop:6, marginBottom:12, position:'relative', zIndex:2, fontWeight:700, textShadow: '0 4px 12px rgba(0,0,0,0.5)' }}>ترقبي الإطلاق قريباً</div>
    <p style={{ fontSize:12, color:'rgba(255,255,255,.7)', textAlign:'center', lineHeight:1.7, marginBottom:24, maxWidth:240, position:'relative', zIndex:2, fontFamily: "'Cairo', sans-serif" }}>
      اكتشفي الصالونات القريبة منكِ، قارني أسعار الخدمات، واحجزي خبيرتكِ المفضلة بسهولة.
    </p>
    <div className="shimmer-btn" style={{
      width:'100%', padding:'12px 20px', borderRadius:24,
      color:'#111', fontSize:14, fontWeight:800, textAlign:'center',
      boxShadow:'0 8px 25px rgba(212,168,53,0.3)', position:'relative', zIndex:2, cursor:'pointer'
    }}>
      قريباً جداً على متجر التطبيقات
    </div>
    <div style={{ marginTop:24, fontSize:9, color:'rgba(255,255,255,.3)', position:'relative', zIndex:2 }}>oraglow.app · ٢٠٢٦</div>
  </div>
);

// ─── HIGH-END MODULAR KINETIC CAPTION CARD ────────────
const CaptionCard = ({ title, subtitle, italicHighlight, start, end, time }) => {
  const op = fadeInOut(start, end, 0.25, 0.25)(time);
  
  // Kinetic slide-up physics linked directly to the scene start
  const y = interpolate([start, start + 0.35], [20, 0], Easing.easeOutCubic)(time);
  const scale = interpolate([start, start + 0.35], [0.93, 1], Easing.easeOutBack)(time);
  
  return (
    <div dir="rtl" style={{
      position: 'absolute',
      top: 50,
      left: '50%',
      transform: `translateX(-50%) translateY(${y}px) scale(${scale})`,
      width: '90%',
      padding: '16px 24px',
      borderRadius: '24px',
      background: 'linear-gradient(180deg, rgba(16, 16, 24, 0.88) 0%, rgba(8, 8, 12, 0.96) 100%)',
      backdropFilter: 'blur(30px)',
      WebkitBackdropFilter: 'blur(30px)',
      // Delicate gold hairline frame all around perfectly framing centered text
      border: `1px solid rgba(212, 168, 53, 0.32)`,
      boxShadow: '0 20px 45px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 20px rgba(212, 168, 53, 0.15)',
      textAlign: 'center', // Centered text alignment
      opacity: op,
      zIndex: 100,
      fontFamily: "'El Messiri', 'Cairo', sans-serif",
      transition: 'none'
    }}>
      
      {/* Bold Editorial Main Header & calligraphic Amiri Highlight */}
      <div style={{
        fontSize: 22,
        fontWeight: 800,
        color: '#fff',
        lineHeight: 1.35,
        textShadow: '0 2px 10px rgba(0,0,0,0.7)',
        fontFamily: "'El Messiri', sans-serif"
      }}>
        {title}
        {italicHighlight && (
          <>
            <span className="serif" style={{
              fontFamily: "'Amiri', serif",
              fontStyle: 'italic',
              fontWeight: 500,
              fontSize: 24,
              color: GOLD,
              textShadow: `0 0 10px ${GOLD}33`,
              display: 'block',
              marginTop: 6
            }}>
              {italicHighlight}
            </span>
          </>
        )}
      </div>

      {/* Grid Partitioned Subtitle */}
      {subtitle && (
        <div style={{
          fontSize: 13,
          color: 'rgba(255,255,255,0.75)',
          fontWeight: 500,
          marginTop: 8,
          lineHeight: 1.5,
          fontFamily: "'Cairo', sans-serif",
          borderTop: '1px solid rgba(255,255,255,0.1)',
          paddingTop: 8
        }}>
          {subtitle}
        </div>
      )}
    </div>
  );
};

// ─── CORE SCENE TIMING & COMPOSITION ──────────────────
const Scene = () => {
  const time = useContext(TimeContext);

  // Background color interpolation based on active animation segments
  const bgHue = interpolate([0, 8.5, 16.0, 25.0], [340, 25, 210, 340])(time);

  // Phone scaling and translation keyframe animations
  const phoneOpacity = interpolate([0, 2.0, 2.6, 24.0, 25.0], [0, 0, 1, 1, 0])(time);
  const phoneY       = interpolate([0, 2.6, 23.5, 24.2, 25.0], [100, 0, 0, 0, -60], Easing.easeOutCubic)(time);
  const phoneScale   = interpolate([2.0, 2.6, 23.5, 24.2, 25.0], [.78, 0.95, 0.95, 0.98, 0.98], Easing.easeOutCubic)(time);

  // Active scene visibilities
  const discoveryOp = fadeInOut(2.6, 7.6, .4, .2)(time);  // Search Map screen
  const searchOp    = fadeInOut(7.4, 10.8, .4, .2)(time); // Nails Search List
  const feedOp      = fadeInOut(10.6, 14.0, .4, .2)(time); // Lookbook Posts Profile
  const profileOp   = fadeInOut(13.8, 17.2, .4, .2)(time); // Services Tab Profile
  const storeOp     = fadeInOut(17.0, 20.4, .4, .2)(time); // Stylist selection
  const proOp       = fadeInOut(20.2, 22.8, .4, .2)(time); // Booking Confirmed Screen
  const ctaOp       = fadeInOut(21.6, 25.0, .4, .2)(time); // Brand Outro

  return (
    <>
      {/* Mesh Glow Background */}
      <div className="animated-glow-bg" style={{
        position:'absolute', inset:0,
        opacity: 0.85
      }}/>
      <div style={{
        position:'absolute', inset:0,
        background: `
          radial-gradient(circle at 50% 20%, hsla(${bgHue}, 60%, 25%, .4) 0%, transparent 60%),
          radial-gradient(circle at 50% 80%, hsla(${bgHue + 40}, 50%, 20%, .4) 0%, transparent 60%)
        `
      }}/>

      {/* Floating Gold Sparkle Stars */}
      {[[40,160],[480,220],[70,800],[450,780],[270,90],[440,510]].map(([x,y],i)=>{
        const sparkOp = ((Math.sin(time * 3.5 + i) + 1) / 2) * 0.4 + 0.15;
        return (
          <svg key={i} width="16" height="16" viewBox="0 0 22 22" style={{ position:'absolute', left:x, top:y, opacity:sparkOp }}>
            <path d="M11 0 L13.5 8.5 L22 11 L13.5 13.5 L11 22 L8.5 13.5 L0 11 L8.5 8.5 Z" fill={GOLD}/>
          </svg>
        );
      })}

      {/* INTRO TITLE CAPTIONS (0.0s - 2.8s) */}
      <Sprite start={0} end={2.8}>
        {() => {
          const op = fadeInOut(0, 2.8, .3, .3)(time);
          const y  = interpolate([0, 1.8], [50, 0], Easing.easeOutCubic)(time);
          return (
            <div dir="rtl" style={{
              position:'absolute', top:'22%', left:'50%', transform:`translate(-50%, calc(-50% + ${y}px))`, width:'88%',
              padding:'44px 28px', borderRadius:'32px',
              background:'linear-gradient(180deg, rgba(14,14,20,0.92) 0%, rgba(6,6,8,0.96) 100%)',
              backdropFilter:'blur(24px)',
              border:`1.2px solid rgba(212,168,53,0.38)`,
              boxShadow:'0 30px 80px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.12), 0 0 25px rgba(212,168,53,0.12)',
              textAlign:'center', opacity:op, zIndex:30, fontFamily:"'El Messiri','Cairo',sans-serif"
            }}>
              {/* Top Accent Star */}
              <div style={{ marginBottom: 22, display: 'flex', justifyContent: 'center' }}>
                <svg width="22" height="22" viewBox="0 0 22 22" style={{ filter: 'drop-shadow(0 0 6px rgba(212,168,53,0.85))' }}>
                  <path d="M11 0 L14 8 L22 11 L14 14 L11 22 L8 14 L0 11 L8 8 Z" fill={GOLD}/>
                </svg>
              </div>

              {/* ORA GLOW - Spaced Brand Header */}
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 24 }}>
                <div dir="ltr" style={{ display: 'flex', alignItems: 'center' }}>
                  <span style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 40, fontWeight: 300, fontStyle: 'italic', color: '#F0D080', letterSpacing: '8px', textShadow: '0 0 8px rgba(240,208,128,0.2)' }}>ORA</span>
                  <span style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 40, fontWeight: 600, color: '#FFFFFF', letterSpacing: '8px', marginLeft: '4px', textShadow: '0 0 8px rgba(255,255,255,0.2)' }}>GLOW</span>
                </div>
              </div>

              {/* Gold Divider */}
              <div style={{ width: '70px', height: '1.2px', background: `linear-gradient(90deg, transparent, ${GOLD}, transparent)`, margin: '0 auto 24px' }} />

              {/* Calligraphic Copy Hook */}
              <div style={{ fontSize:20, fontWeight:600, color:'rgba(255,255,255,0.95)', letterSpacing: 0.8, marginBottom: 12, textShadow: '0 2px 10px rgba(0,0,0,0.5)' }}>
                متحيرة عند مين تعملي أظافركِ؟
              </div>
              <div className="serif" style={{
                fontFamily:"'Amiri',serif", fontStyle:'italic', fontWeight:500,
                fontSize: 32, color: GOLD, lineHeight: 1.35,
                textShadow: `0 0 15px rgba(212,168,53,0.4)`
              }}>
                وتعبتي وانتي تدوري ؟
              </div>
            </div>
          );
        }}
      </Sprite>

      {/* DYNAMIC SCREEN PHONE MOCKUP RENDERING THE REAL APP SCREENS */}
      <div style={{ opacity:phoneOpacity }}>
        
        {/* 1. Search Map Screen with modal overlay controls */}
        <Sprite start={2.6} end={7.6}>
          <Phone y={phoneY} scale={phoneScale} opacity={discoveryOp}
            screen={<SearchScreen onSalonClick={NOOP} navTab="search" onNavigate={NOOP} initialView="map" initialShowFilters={time >= 4.4} initialFilterCats={time >= 5.6 ? ['أظافر'] : []} />}
            touches={
              <>
                <TouchIndicator x={345} y={115} start={3.4} end={4.0}/>
                <TouchIndicator x={110} y={520} start={5.2} end={5.8}/>
                <TouchIndicator x={130} y={790} start={6.6} end={7.2}/>
                <FloatingCursor path={[
                  { t: 2.6, x: 200, y: 600, op: 0 },
                  { t: 2.8, x: 200, y: 600, op: 1 },
