      const rad=a*Math.PI/180, x2=20+18*Math.sin(rad), y2=20-18*Math.cos(rad);
      return <line key={a} x1="20" y1="20" x2={x2} y2={y2} stroke={c} strokeWidth=".9" opacity=".55"/>;
    })}
    <circle cx="20" cy="20" r="13" fill="none" stroke={c} strokeWidth="1.2"/>
    <circle cx="20" cy="20" r="5" fill={c}/>
    {[0,90,180,270].map(a=>{
      const rad=a*Math.PI/180, cx=20+13*Math.sin(rad), cy=20-13*Math.cos(rad);

);
