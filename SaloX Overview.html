<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaloX — All Screens</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=El+Messiri:wght@400;500;600;700&family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#111; font-family:'Cairo',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="salox-components.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

const NOOP = () => {};
const SAMPLE_PRO = { id:1, name:'Alaa', role:'Senior Barber', rating:4.99 };

// Each screen rendered inside a phone-shaped clip
const S = ({ children, bg='#fff' }) => (
  <div style={{
    width:390, height:844,
    background: bg,
    borderRadius:44,
    overflow:'hidden',
    display:'flex',
    flexDirection:'column',
    boxShadow:'0 8px 40px rgba(0,0,0,.18)',
    position:'relative',
  }}>
    {/* dynamic island pill */}
    <div style={{ position:'absolute', top:13, left:'50%', transform:'translateX(-50%)', width:126, height:34, background:'#0C0C0C', borderRadius:20, zIndex:200, pointerEvents:'none' }}/>
    {children}
  </div>
);

const Overview = () => (
  <DesignCanvas background="#111">

    {/* ── ONBOARDING ─────────────────────────────── */}
    <DCSection id="onboarding" title="Onboarding">
      <DCArtboard id="splash" label="Splash" width={390} height={844}>
        <S bg="#FAFAFA">
          <SplashScreen onContinue={NOOP}/>
        </S>
      </DCArtboard>
    </DCSection>

    {/* ── HOME & STORE ───────────────────────────── */}
    <DCSection id="home" title="Home & Store">
      <DCArtboard id="feed" label="Feed (Salon Directory)" width={390} height={844}>
        <S>
          <StoreScreen onSalonClick={NOOP} navTab="home" onNavigate={NOOP}/>
        </S>
      </DCArtboard>

      <DCArtboard id="store" label="Store (Social Lookbook)" width={390} height={844}>
        <S>
          <FeedScreen onSalonClick={NOOP} navTab="store" onNavigate={NOOP}/>
        </S>
      </DCArtboard>
    </DCSection>

    {/* ── SEARCH ─────────────────────────────────── */}
    <DCSection id="search" title="Search">
      <DCArtboard id="search-map" label="Search · Map" width={390} height={844}>
        <S>
          <SearchScreen onSalonClick={NOOP} navTab="search" onNavigate={NOOP} initialView="map"/>
        </S>
      </DCArtboard>

      <DCArtboard id="search-card" label="Search · Pin Card" width={390} height={844}>
        <S>
          <SearchScreen onSalonClick={NOOP} navTab="search" onNavigate={NOOP} initialView="card"/>
        </S>
      </DCArtboard>

      <DCArtboard id="search-list" label="Search · List" width={390} height={844}>
        <S>
          <SearchScreen onSalonClick={NOOP} navTab="search" onNavigate={NOOP} initialView="list"/>
        </S>
      </DCArtboard>

      <DCArtboard id="search-filters" label="Search · Filters" width={390} height={844}>
        <S>
          <SearchScreen onSalonClick={NOOP} navTab="search" onNavigate={NOOP} initialView="map" initialShowFilters={true}/>
        </S>
      </DCArtboard>
    </DCSection>

    {/* ── SALON PROFILE ──────────────────────────── */}
    <DCSection id="salon" title="Salon Profile">
      <DCArtboard id="salon-services" label="Salon · Services" width={390} height={844}>
        <S>
          <SalonProfileScreen salon={SALONS[0]} onBack={NOOP} onBook={NOOP} initialTab="services"/>
        </S>
      </DCArtboard>

      <DCArtboard id="salon-posts" label="Salon · Posts" width={390} height={844}>
        <S>
          <SalonProfileScreen salon={SALONS[0]} onBack={NOOP} onBook={NOOP} initialTab="posts"/>
        </S>
      </DCArtboard>

      <DCArtboard id="salon-store" label="Salon · Store" width={390} height={844}>
        <S>
          <SalonProfileScreen salon={SALONS[0]} onBack={NOOP} onBook={NOOP} initialTab="store"/>
        </S>
      </DCArtboard>

      <DCArtboard id="salon-details" label="Salon · Details" width={390} height={844}>
        <S>
          <SalonProfileScreen salon={SALONS[0]} onBack={NOOP} onBook={NOOP} initialTab="details"/>
        </S>
      </DCArtboard>
    </DCSection>

    {/* ── BOOKING ────────────────────────────────── */}
    <DCSection id="booking" title="Booking">
      <DCArtboard id="select-pro" label="Select Professional" width={390} height={844}>
        <S bg="#F8F8F8">
          <SelectProfessionalScreen onBack={NOOP} onSelect={NOOP}/>
        </S>
      </DCArtboard>

      <DCArtboard id="confirmed" label="Booking Confirmed" width={390} height={844}>
        <S>
          <BookingConfirmedScreen professional={SAMPLE_PRO} salon={SALONS[0]} onDone={NOOP}/>
        </S>
      </DCArtboard>
    </DCSection>

  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<Overview/>);
</script>
</body>
</html>
