<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OraGlow — Logo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0C0907;
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 40px;
    gap:72px;
  }
  .row { display:flex; gap:52px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .card { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .label { font-size:10px; letter-spacing:2.5px; color:rgba(255,255,255,.25); text-transform:uppercase; font-weight:600; font-family:'Cairo',sans-serif; }
  .bg-light { background:#FAF6F0; border-radius:20px; padding:36px 44px; }
  .bg-rose  { background:linear-gradient(135deg,#7A3050,#4A1030); border-radius:20px; padding:36px 44px; }
  .bg-blush { background:linear-gradient(135deg,#F5D5DD,#EBC0C8); border-radius:20px; padding:36px 44px; }
</style>
</head>
<body>

<!-- ── HERO ─────────────────────────────── -->
<svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#D4A040" stop-opacity=".22"/>
      <stop offset="70%" stop-color="#D4A040" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#D4A040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#A87020"/>
    </linearGradient>
    <linearGradient id="roseH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#E890A8"/>
      <stop offset="100%" stop-color="#C06080"/>
    </linearGradient>
    <linearGradient id="nameH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#F0D898"/>
      <stop offset="50%" stop-color="#E8C070"/>
      <stop offset="100%" stop-color="#C08030"/>
    </linearGradient>
  </defs>

  <!-- Glow halo -->
  <circle cx="90" cy="90" r="80" fill="url(#heroGlow)"/>

  <!-- Ray lines: 8 long + 8 short alternating -->
  <!-- Long rays -->
  <line x1="90" y1="90" x2="90"  y2="12"  stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="147" y2="33"  stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="168" y2="90"  stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="147" y2="147" stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="90"  y2="168" stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="33"  y2="147" stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="12"  y2="90"  stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <line x1="90" y1="90" x2="33"  y2="33"  stroke="#D4A040" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <!-- Short rays -->
  <line x1="90" y1="90" x2="117" y2="21"  stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="159" y2="63"  stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="159" y2="117" stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="117" y2="159" stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="63"  y2="159" stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="21"  y2="117" stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="21"  y2="63"  stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>
  <line x1="90" y1="90" x2="63"  y2="21"  stroke="#E890A8" stroke-width="0.7" stroke-linecap="round" opacity=".45"/>

  <!-- Outer ring -->
  <circle cx="90" cy="90" r="60" fill="none" stroke="url(#goldH)" stroke-width="1.2"/>
  <!-- Mid ring hairline -->
  <circle cx="90" cy="90" r="42" fill="none" stroke="url(#goldH)" stroke-width="0.5" opacity=".35"/>
  <!-- Center orb -->
  <circle cx="90" cy="90" r="16" fill="url(#goldH)" opacity=".18"/>
  <circle cx="90" cy="90" r="10" fill="url(#goldH)" opacity=".5"/>
  <circle cx="90" cy="90" r="5"  fill="url(#goldH)"/>
  <!-- 4 rose petal-gems on ring -->
  <circle cx="90"  cy="30" r="3.5" fill="url(#roseH)"/>
  <circle cx="150" cy="90" r="3.5" fill="url(#roseH)"/>
  <circle cx="90"  cy="150" r="3.5" fill="url(#roseH)"/>
  <circle cx="30"  cy="90" r="3.5" fill="url(#roseH)"/>

  <!-- Wordmark -->
  <text x="200" y="80"  font-family="Cormorant Garamond, serif" font-size="58" font-weight="300" font-style="italic" fill="url(#nameH)" letter-spacing="1">Ora</text>
  <text x="282" y="80"  font-family="Cormorant Garamond, serif" font-size="58" font-weight="600" fill="url(#roseH)" letter-spacing="-1">Glow</text>
  <!-- Tag -->
  <text x="202" y="104" font-family="Cairo,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,.32)" letter-spacing="3.5">BEAUTY · GLOW · CARE</text>
  <!-- Arabic -->
  <text x="202" y="130" font-family="Cairo,sans-serif" font-size="20" font-weight="400" fill="rgba(240,216,152,.45)" letter-spacing="2">أورا غلو</text>
</svg>

<!-- ── VARIATIONS ────────────────────────── -->

        <text x="121" y="44" font-family="Cormorant Garamond,serif" font-size="22" font-weight="600" fill="#A04060">Glow</text>
