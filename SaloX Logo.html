<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaloX — Logo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0E0B0D; font-family:'Cairo',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 40px; gap:72px; }
  .row { display:flex; gap:56px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .card { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .label { font-size:10px; letter-spacing:2.5px; color:rgba(255,255,255,.28); text-transform:uppercase; font-weight:600; }
  .bg-light { background:#FAF7F5; border-radius:20px; padding:36px 44px; }
  .bg-rose  { background:linear-gradient(135deg,#C0607A,#9C3F5A); border-radius:20px; padding:36px 44px; }
</style>
</head>
<body>

<!-- ── HERO ─────────────────────────────── -->
<svg width="380" height="180" viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C76A"/>
      <stop offset="100%" stop-color="#B8891C"/>
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07090"/>
      <stop offset="100%" stop-color="#B04060"/>
    </linearGradient>
  </defs>

  <!-- Mark at left -->
  <g transform="translate(14, 0)">
    <!-- Outer thin ring -->
    <circle cx="90" cy="90" r="82" fill="none" stroke="url(#goldG)" stroke-width="1"/>
    <!-- 6-petal blossom -->
    <!-- Each petal: an ellipse rotated around center -->
    <ellipse cx="90" cy="55"  rx="12" ry="26" fill="none" stroke="url(#goldG)" stroke-width="1.6" transform="rotate(0   90 90)"/>
    <ellipse cx="90" cy="55"  rx="12" ry="26" fill="none" stroke="url(#goldG)" stroke-width="1.6" transform="rotate(60  90 90)"/>
    <ellipse cx="90" cy="55"  rx="12" ry="26" fill="none" stroke="url(#goldG)" stroke-width="1.6" transform="rotate(120 90 90)"/>
    <ellipse cx="90" cy="55"  rx="12" ry="26" fill="none" stroke="url(#goldG)" stroke-width="1.6" transform="rotate(180 90 90)"/>
    <ellipse cx="90" cy="55"  rx="12" ry="26" fill="none" stroke="url(#goldG)" stroke-width="1.6" transform="rotate(240 90 90)"/>
    <ellipse cx="90" cy="55"  rx="12" ry="26" fill="none" stroke="url(#goldG)" stroke-width="1.6" transform="rotate(300 90 90)"/>
    <!-- Inner ring -->
    <circle cx="90" cy="90" r="24" fill="none" stroke="url(#goldG)" stroke-width="1" opacity="0.5"/>
    <!-- Center gem -->
    <circle cx="90" cy="90" r="7" fill="url(#goldG)"/>
    <!-- 6 small petal-tip gems -->
    <circle cx="90" cy="64"  r="3" fill="url(#roseG)" transform="rotate(0   90 90)"/>
    <circle cx="90" cy="64"  r="3" fill="url(#roseG)" transform="rotate(60  90 90)"/>
    <circle cx="90" cy="64"  r="3" fill="url(#roseG)" transform="rotate(120 90 90)"/>
    <circle cx="90" cy="64"  r="3" fill="url(#roseG)" transform="rotate(180 90 90)"/>
    <circle cx="90" cy="64"  r="3" fill="url(#roseG)" transform="rotate(240 90 90)"/>
    <circle cx="90" cy="64"  r="3" fill="url(#roseG)" transform="rotate(300 90 90)"/>
  </g>

  <!-- Wordmark -->
  <text x="214" y="78"  font-family="Cairo,sans-serif" font-size="50" font-weight="200" fill="white" letter-spacing="-1">Salo</text>
  <text x="320" y="78"  font-family="Cairo,sans-serif" font-size="50" font-weight="800" fill="url(#goldG)">X</text>
  <!-- Arabic -->
  <text x="216" y="108" font-family="Cairo,sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,.38)" letter-spacing="2">سالوكس</text>
  <!-- Tagline -->
  <text x="216" y="132" font-family="Cairo,sans-serif" font-size="10" font-weight="300" fill="rgba(255,255,255,.2)" letter-spacing="3">BEAUTY · BOOKING · CARE</text>
</svg>

<!-- ── VARIATIONS ────────────────────────── -->
<div class="row">

  <!-- Dark -->
  <div class="card">
    <svg width="150" height="80" viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E8C76A"/>
          <stop offset="100%" stop-color="#B8891C"/>
        </linearGradient>
        <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E07090"/>
          <stop offset="100%" stop-color="#B04060"/>
        </linearGradient>
      </defs>
      <g transform="translate(4,4)">
        <circle cx="36" cy="36" r="32" fill="none" stroke="url(#g1)" stroke-width="0.8"/>
        <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g1)" stroke-width="1.2" transform="rotate(0   36 36)"/>
        <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g1)" stroke-width="1.2" transform="rotate(60  36 36)"/>
        <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g1)" stroke-width="1.2" transform="rotate(120 36 36)"/>
        <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g1)" stroke-width="1.2" transform="rotate(180 36 36)"/>
        <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g1)" stroke-width="1.2" transform="rotate(240 36 36)"/>
        <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g1)" stroke-width="1.2" transform="rotate(300 36 36)"/>
        <circle cx="36" cy="36" r="3" fill="url(#g1)"/>
        <circle cx="36" cy="25" r="1.5" fill="url(#r1)" transform="rotate(0   36 36)"/>
        <circle cx="36" cy="25" r="1.5" fill="url(#r1)" transform="rotate(60  36 36)"/>
        <circle cx="36" cy="25" r="1.5" fill="url(#r1)" transform="rotate(120 36 36)"/>
        <circle cx="36" cy="25" r="1.5" fill="url(#r1)" transform="rotate(180 36 36)"/>
        <circle cx="36" cy="25" r="1.5" fill="url(#r1)" transform="rotate(240 36 36)"/>
        <circle cx="36" cy="25" r="1.5" fill="url(#r1)" transform="rotate(300 36 36)"/>
      </g>
      <text x="86" y="36" font-family="Cairo,sans-serif" font-size="20" font-weight="200" fill="white">Salo</text>
      <text x="129" y="36" font-family="Cairo,sans-serif" font-size="20" font-weight="800" fill="url(#g1)">X</text>
      <text x="87" y="52" font-family="Cairo,sans-serif" font-size="9" fill="rgba(255,255,255,.35)" letter-spacing="1.5">سالوكس</text>
    </svg>
    <span class="label">Primary · Dark</span>
  </div>

  <!-- Light -->
  <div class="card">
    <div class="bg-light">
      <svg width="150" height="80" viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8C76A"/>
            <stop offset="100%" stop-color="#B8891C"/>
          </linearGradient>
          <linearGradient id="r2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E07090"/>
            <stop offset="100%" stop-color="#B04060"/>
          </linearGradient>
        </defs>
        <g transform="translate(4,4)">
          <circle cx="36" cy="36" r="32" fill="none" stroke="url(#g2)" stroke-width="0.8"/>
          <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g2)" stroke-width="1.2" transform="rotate(0   36 36)"/>
          <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g2)" stroke-width="1.2" transform="rotate(60  36 36)"/>
          <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g2)" stroke-width="1.2" transform="rotate(120 36 36)"/>
          <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g2)" stroke-width="1.2" transform="rotate(180 36 36)"/>
          <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g2)" stroke-width="1.2" transform="rotate(240 36 36)"/>
          <ellipse cx="36" cy="20" rx="5" ry="11" fill="none" stroke="url(#g2)" stroke-width="1.2" transform="rotate(300 36 36)"/>
          <circle cx="36" cy="36" r="3" fill="url(#g2)"/>
          <circle cx="36" cy="25" r="1.5" fill="url(#r2)" transform="rotate(0   36 36)"/>
          <circle cx="36" cy="25" r="1.5" fill="url(#r2)" transform="rotate(60  36 36)"/>
          <circle cx="36" cy="25" r="1.5" fill="url(#r2)" transform="rotate(120 36 36)"/>
          <circle cx="36" cy="25" r="1.5" fill="url(#r2)" transform="rotate(180 36 36)"/>
          <circle cx="36" cy="25" r="1.5" fill="url(#r2)" transform="rotate(240 36 36)"/>
          <circle cx="36" cy="25" r="1.5" fill="url(#r2)" transform="rotate(300 36 36)"/>
        </g>
        <text x="86" y="36" font-family="Cairo,sans-serif" font-size="20" font-weight="200" fill="#1A1A1A">Salo</text>
        <text x="129" y="36" font-family="Cairo,sans-serif" font-size="20" font-weight="800" fill="url(#g2)">X</text>
        <text x="87" y="52" font-family="Cairo,sans-serif" font-size="9" fill="#999" letter-spacing="1.5">سالوكس</text>
      </svg>
    </div>
    <span class="label">Primary · Light</span>
  </div>

  <!-- Icon only -->
  <div class="card">
    <svg width="88" height="88" viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E8C76A"/>
          <stop offset="100%" stop-color="#B8891C"/>
        </linearGradient>
        <linearGradient id="r3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E07090"/>
          <stop offset="100%" stop-color="#B04060"/>
        </linearGradient>
      </defs>
      <circle cx="44" cy="44" r="41" fill="none" stroke="url(#g3)" stroke-width="1.2"/>
      <ellipse cx="44" cy="24" rx="7" ry="15" fill="none" stroke="url(#g3)" stroke-width="1.5" transform="rotate(0   44 44)"/>
      <ellipse cx="44" cy="24" rx="7" ry="15" fill="none" stroke="url(#g3)" stroke-width="1.5" transform="rotate(60  44 44)"/>
      <ellipse cx="44" cy="24" rx="7" ry="15" fill="none" stroke="url(#g3)" stroke-width="1.5" transform="rotate(120 44 44)"/>
      <ellipse cx="44" cy="24" rx="7" ry="15" fill="none" stroke="url(#g3)" stroke-width="1.5" transform="rotate(180 44 44)"/>
      <ellipse cx="44" cy="24" rx="7" ry="15" fill="none" stroke="url(#g3)" stroke-width="1.5" transform="rotate(240 44 44)"/>
      <ellipse cx="44" cy="24" rx="7" ry="15" fill="none" stroke="url(#g3)" stroke-width="1.5" transform="rotate(300 44 44)"/>
      <circle cx="44" cy="44" r="10" fill="none" stroke="url(#g3)" stroke-width="0.8" opacity="0.5"/>
      <circle cx="44" cy="44" r="4.5" fill="url(#g3)"/>
      <circle cx="44" cy="29" r="2.5" fill="url(#r3)" transform="rotate(0   44 44)"/>
      <circle cx="44" cy="29" r="2.5" fill="url(#r3)" transform="rotate(60  44 44)"/>
      <circle cx="44" cy="29" r="2.5" fill="url(#r3)" transform="rotate(120 44 44)"/>
      <circle cx="44" cy="29" r="2.5" fill="url(#r3)" transform="rotate(180 44 44)"/>
      <circle cx="44" cy="29" r="2.5" fill="url(#r3)" transform="rotate(240 44 44)"/>
      <circle cx="44" cy="29" r="2.5" fill="url(#r3)" transform="rotate(300 44 44)"/>
    </svg>
    <span class="label">Icon Only</span>
  </div>

  <!-- Rose bg -->
  <div class="card">
    <div class="bg-rose">
      <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="33" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1"/>
        <ellipse cx="36" cy="20" rx="6" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.3" transform="rotate(0   36 36)"/>
        <ellipse cx="36" cy="20" rx="6" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.3" transform="rotate(60  36 36)"/>
        <ellipse cx="36" cy="20" rx="6" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.3" transform="rotate(120 36 36)"/>
        <ellipse cx="36" cy="20" rx="6" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.3" transform="rotate(180 36 36)"/>
        <ellipse cx="36" cy="20" rx="6" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.3" transform="rotate(240 36 36)"/>
        <ellipse cx="36" cy="20" rx="6" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.3" transform="rotate(300 36 36)"/>
        <circle cx="36" cy="36" r="4" fill="rgba(255,255,255,.95)"/>
        <circle cx="36" cy="24" r="2" fill="rgba(255,255,200,.8)" transform="rotate(0   36 36)"/>
        <circle cx="36" cy="24" r="2" fill="rgba(255,255,200,.8)" transform="rotate(60  36 36)"/>
        <circle cx="36" cy="24" r="2" fill="rgba(255,255,200,.8)" transform="rotate(120 36 36)"/>
        <circle cx="36" cy="24" r="2" fill="rgba(255,255,200,.8)" transform="rotate(180 36 36)"/>
        <circle cx="36" cy="24" r="2" fill="rgba(255,255,200,.8)" transform="rotate(240 36 36)"/>
        <circle cx="36" cy="24" r="2" fill="rgba(255,255,200,.8)" transform="rotate(300 36 36)"/>
      </svg>
    </div>
    <span class="label">Icon · Rose</span>
  </div>

</div>

<!-- ── ARABIC WORDMARK ───────────────────── -->
<svg width="320" height="66" viewBox="0 0 320 66" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gAr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C76A"/>
      <stop offset="100%" stop-color="#B8891C"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="320" y2="6" stroke="url(#gAr)" stroke-width="0.5" opacity="0.4"/>
  <text x="160" y="46" font-family="Cairo,sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">سالوكس</text>
  <line x1="0" y1="60" x2="320" y2="60" stroke="url(#gAr)" stroke-width="0.5" opacity="0.4"/>
  <!-- Rose diamond accents -->
  <polygon points="0,6  7,3  0,0"  fill="#C0607A"/>
  <polygon points="320,6 313,3 320,0" fill="#C0607A"/>
  <polygon points="0,60  7,57  0,54"  fill="#C0607A"/>
  <polygon points="320,60 313,57 320,54" fill="#C0607A"/>
</svg>

<!-- ── APP ICON ──────────────────────────── -->
<div class="card">
  <svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1C1118"/>
        <stop offset="100%" stop-color="#0E0B0D"/>
      </linearGradient>
      <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C76A"/>
        <stop offset="100%" stop-color="#B8891C"/>
      </linearGradient>
      <linearGradient id="r4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E07090"/>
        <stop offset="100%" stop-color="#B04060"/>
      </linearGradient>
    </defs>
    <rect width="96" height="96" rx="22" fill="url(#appBg)"/>
    <!-- Subtle rose top glow -->
    <ellipse cx="48" cy="0" rx="48" ry="20" fill="#C0607A" opacity="0.08"/>
    <circle cx="48" cy="48" r="35" fill="none" stroke="url(#g4)" stroke-width="1"/>
    <ellipse cx="48" cy="28" rx="6.5" ry="14" fill="none" stroke="url(#g4)" stroke-width="1.4" transform="rotate(0   48 48)"/>
    <ellipse cx="48" cy="28" rx="6.5" ry="14" fill="none" stroke="url(#g4)" stroke-width="1.4" transform="rotate(60  48 48)"/>
    <ellipse cx="48" cy="28" rx="6.5" ry="14" fill="none" stroke="url(#g4)" stroke-width="1.4" transform="rotate(120 48 48)"/>
    <ellipse cx="48" cy="28" rx="6.5" ry="14" fill="none" stroke="url(#g4)" stroke-width="1.4" transform="rotate(180 48 48)"/>
    <ellipse cx="48" cy="28" rx="6.5" ry="14" fill="none" stroke="url(#g4)" stroke-width="1.4" transform="rotate(240 48 48)"/>
    <ellipse cx="48" cy="28" rx="6.5" ry="14" fill="none" stroke="url(#g4)" stroke-width="1.4" transform="rotate(300 48 48)"/>
    <circle cx="48" cy="48" r="4.5" fill="url(#g4)"/>
    <circle cx="48" cy="34" r="2.2" fill="url(#r4)" transform="rotate(0   48 48)"/>
    <circle cx="48" cy="34" r="2.2" fill="url(#r4)" transform="rotate(60  48 48)"/>
    <circle cx="48" cy="34" r="2.2" fill="url(#r4)" transform="rotate(120 48 48)"/>
    <circle cx="48" cy="34" r="2.2" fill="url(#r4)" transform="rotate(180 48 48)"/>
    <circle cx="48" cy="34" r="2.2" fill="url(#r4)" transform="rotate(240 48 48)"/>
    <circle cx="48" cy="34" r="2.2" fill="url(#r4)" transform="rotate(300 48 48)"/>
  </svg>
  <span class="label">App Icon</span>
</div>

</body>
</html>
